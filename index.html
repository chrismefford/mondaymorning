<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fast vanity redirect: fires while the head parses, before the app bundle loads, so shared links jump straight to tickets. -->
    <script>
      (function () {
        var p = location.pathname.replace(/\/+$/, "");
        if (p === "/grandopening" || p === "/grand-opening") {
          location.replace("https://www.eventbrite.com/e/craft-na-brewery-opening-monday-morning-tickets-1993155984203?aff=oddtdtcreator");
        }
      })();
    </script>
    <title>Monday Morning | America's #1 NA Bottle Shop & Tasting Room</title>
    <meta name="description" content="San Diego's premier non-alcoholic bottle shop with 500+ flavors. NA beer, wine, spirits & cocktails. Try before you buy at our Pacific Beach & Ocean Beach locations." />
    <!-- No static canonical here: each page sets its own via Helmet. A hardcoded one would conflict and make every page canonicalize to the homepage. -->

    <!-- Open Graph / Social -->
    <meta property="og:title" content="Monday Morning | America's #1 NA Bottle Shop" />
    <meta property="og:description" content="500+ non-alcoholic flavors. NA beer, wine, spirits & more. Two San Diego locations." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://mondaymorning-af.com/og-monday-morning.png" />
    <meta property="og:site_name" content="Monday Morning Bottle Shop" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Monday Morning | America's #1 NA Bottle Shop" />
    <meta name="twitter:description" content="500+ non-alcoholic flavors. NA beer, wine, spirits & more. Two San Diego locations." />
    <meta name="twitter:image" content="https://mondaymorning-af.com/og-monday-morning.png" />
    
    <!-- Favicon - multiple formats for maximum compatibility -->

    <link rel="icon" href="/favicon.ico" sizes="48x48" />

    <!-- Preconnect for hero image source (kept for any remaining Unsplash assets in app) -->

    <!-- Self-hosted fonts: preload the LCP-critical serif so the H1 paints without waiting for CSS bundle -->

    <link rel="preload" as="font" type="font/woff2" href="/fonts/dm-sans-latin-400-normal.woff2" crossorigin />
